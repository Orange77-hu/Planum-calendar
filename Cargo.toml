[package]
name = "Planum"
version = "1.2.3"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
eframe = { version = "0.29.1", features = ["persistence"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rfd = "0.15"
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3.0"
